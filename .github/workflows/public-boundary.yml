name: Public release boundary

on:
  pull_request:
  push:

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve private source or public candidate tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f public/public_export_policy.json && -f scripts/build_public_export.py ]]; then
            candidate="${RUNNER_TEMP}/public-candidate"
            python3 scripts/build_public_export.py --output-dir "${candidate}"
            echo "PUBLIC_CANDIDATE_ROOT=${candidate}" >> "${GITHUB_ENV}"
          elif [[ -f PUBLIC_EXPORT_POLICY.json ]]; then
            echo "PUBLIC_CANDIDATE_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          else
            echo "No private export policy or exported public policy found" >&2
            exit 1
          fi
      - name: Reject private, unexpected, symlinked or secret-bearing paths
        run: >-
          python3 scripts/check_public_release_boundary.py
          --root "${PUBLIC_CANDIDATE_ROOT}"
          --policy "${PUBLIC_CANDIDATE_ROOT}/PUBLIC_EXPORT_POLICY.json"
      - name: Verify copy manifest, file hashes and Python syntax
        run: >-
          python3 "${PUBLIC_CANDIDATE_ROOT}/scripts/verify_public_export.py"
          --root "${PUBLIC_CANDIDATE_ROOT}"
      - name: Install public Industry Radar dependencies
        run: >-
          python3 -m pip install
          -r "${PUBLIC_CANDIDATE_ROOT}/industry-radar/requirements.txt"
      - name: Run offline public import and configuration smoke check
        run: >-
          python3 "${PUBLIC_CANDIDATE_ROOT}/scripts/smoke_public_radar.py"
          --root "${PUBLIC_CANDIDATE_ROOT}"
