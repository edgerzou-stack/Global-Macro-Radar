# Issuer-owned newsroom sitemaps are parsed by strict, source-specific adapters.
official_newsrooms:
  - "https://news.modernatx.com/sitemap.xml"
  - "https://www.merck.com/media/news/"
  - "https://www.smics.com/en/site/news"

# SpaceX's official site is a client-rendered app. Its audited content API is
# parsed by a separate fail-closed adapter; NASA/JPL remains authoritative only
# for NASA/JPL events and cannot authenticate a SpaceX issuer claim.
official_space_newsrooms:
  - "https://content.spacex.com/api/spacex-website/updates"

source_registry_file: source_registry.yaml
rss_source_cooldown_enabled: true

rss_required_primary_domains: [ai, semiconductor, biotech, energy, space]

# Optional source-family gates. A daily run fails closed when a named critical
# group loses the configured minimum healthy or fresh sources, even if the
# aggregate RSS ratios still pass.
rss_critical_source_groups:
  - name: "primary-evidence"
    sources:
      - "https://openai.com/news/rss.xml"
      - "https://huggingface.co/blog/feed.xml"
      - "https://blog.google/technology/ai/rss/"
      - "https://deepmind.google/blog/rss.xml"
      - "https://blogs.nvidia.com/feed/"
      - "https://nvidianews.nvidia.com/releases.xml"
      - "https://www.intc.com/news-events/press-releases/rss"
      - "https://www.microsoft.com/en-us/research/feed/"
      - "https://aws.amazon.com/blogs/machine-learning/feed/"
      - "https://www.ema.europa.eu/en/news.xml"
      - "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml"
      - "https://www.eia.gov/rss/todayinenergy.xml"
      - "https://www.nist.gov/news-events/news/rss.xml"
      - "https://www.sec.gov/news/pressreleases.rss"
      - "https://www.jpl.nasa.gov/feeds/news/"
      - "https://www.hkexgroup.com/Global/RSS-Feeds/NewsRelease?sc_lang=en"
    min_available_sources: 7
    min_current_sources: 0
    content_max_age_hours: 336
  - name: "frontier-technology"
    sources:
      - "https://www.technologyreview.com/feed/"
      - "https://blog.google/technology/ai/rss/"
      - "https://blogs.nvidia.com/feed/"
      - "https://www.microsoft.com/en-us/research/feed/"
      - "https://feeds.arstechnica.com/arstechnica/technology-lab"
    min_available_sources: 3
    min_current_sources: 2
    content_max_age_hours: 168

# Public-safe default: every external LLM provider is disabled. Enable exactly
# the reviewed provider in local config.yaml after configuring its credential.
llm:
  # offline is the public/default zero-API mode. Use interactive to emit a
  # folder-AI review bundle, unattended for the configured provider chain, or
  # deepseek to pin all paid calls to DeepSeek.
  mode: "offline"
  order: ["deepseek", "openai"]
  policy:
    daily_budget_cny: 2.0
    max_articles_per_run: 20
    max_api_calls_per_run: 8
    estimated_cny_per_call: 0.10
    allow_llm_eval: false
  providers:
    gemini:
      enabled: false
    deepseek:
      enabled: false
      model: "deepseek-v4-flash"
    openai:
      enabled: false

output:
  format: "markdown"
  language: "Chinese"
  min_score_to_keep: 8 # 任一维度达到 8 分即保留
  hours_back: 48 # 过去48小时
  model: "deepseek-v4-flash" # 使用 DeepSeek 进行核心推理
  rss_max_failure_ratio: 0.25
  rss_min_available_ratio: 0.5 # 可用性与窗口内新鲜内容分开检查
  rss_min_fresh_sources: 5
  rss_min_total_fresh_entries: 10
  rss_min_configured_sources: 10
  rss_max_source_fresh_entry_share: 0.5
  report_source_concentration_warning_ratio: 0.6
  rss_min_primary_available_sources: 7
  rss_min_primary_available_per_domain: 1
  rss_min_primary_current_per_domain: 0
  rss_min_primary_fresh_entry_share_warning: 0.10 # 仅诊断原始文章构成，不代表一手源不可用
  max_selected_per_discovery_source: 2
  max_items_per_section: 10
  primary_evidence_score_tolerance: 0.75
  report_min_primary_supported_ratio: 0.70
  enforce_report_primary_supported_ratio: true # 主榜不足70%一手支持时宁可缩短，不以二手稿凑数

strategic_hardtech:
  enabled: true
  max_items_per_topic: 2

delivery:
  enabled: false
  sender_email: "your_sender@example.com" # 填写你的发送邮箱地址
  recipient_email: "your_recipient@example.com"      # 接收报告的邮箱
  subject: "Global Macro Radar Daily Report"
  smtp_server: "smtp.mail.me.com"
  smtp_port: 587
